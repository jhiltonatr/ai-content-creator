<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">StoryForge</title>
  <defs>
    <!-- Forge tile: deep charcoal with a warm, worked-metal sheen -->
    <radialGradient id="bg" cx="0.38" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#3a2935"/>
      <stop offset="0.5" stop-color="#211721"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </radialGradient>
    <!-- The hearth burning behind the nib -->
    <radialGradient id="hearth" cx="0.32" cy="0.78" r="0.62">
      <stop offset="0" stop-color="#8a3a12" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8a3a12" stop-opacity="0"/>
    </radialGradient>
    <!-- Forged steel for the nib body -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="0.5" stop-color="#b9c3d3"/>
      <stop offset="1" stop-color="#77839a"/>
    </linearGradient>
    <!-- Ember beats: the nodes of the branching story -->
    <radialGradient id="ember" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffdd99"/>
      <stop offset="0.5" stop-color="#ffa044"/>
      <stop offset="1" stop-color="#e05a1e"/>
    </radialGradient>
    <!-- The live spark hammering out a new word at the tip -->
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.45" stop-color="#ffcf7d"/>
      <stop offset="0.8" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="url(#bg)"/>
  <rect x="7.5" y="7.5" width="497" height="497" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="164" cy="400" r="300" fill="url(#hearth)"/>

  <!-- Faint lore constellation: the wider story graph around the pen -->
  <g fill="#8a94a8" opacity="0.28">
    <circle cx="96" cy="128" r="3"/>
    <circle cx="430" cy="96" r="2.5"/>
    <circle cx="452" cy="316" r="3"/>
    <circle cx="120" cy="300" r="2"/>
    <circle cx="408" cy="452" r="2.5"/>
  </g>
  <g stroke="#8a94a8" stroke-width="1.3" stroke-dasharray="2 9" opacity="0.2" fill="none">
    <path d="M96 128 L430 96"/>
    <path d="M120 300 L452 316"/>
    <path d="M408 452 L452 316"/>
  </g>

  <!--
    The nib: a forged-steel pen pointed at the lower-left writing hand.
    Its spine forges the story outward into a branching node-tree, and its
    tip strikes a spark that lands as a dotted path of new beats.
  -->
  <path d="M170 160 L350 150 Q362 244 150 398 Z" fill="url(#steel)" stroke="#141019" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left-edge highlight: the newly hammered edge of the steel -->
  <path d="M170 160 L150 398" fill="none" stroke="#eef2f9" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Breather hole and ink slit -->
  <circle cx="252" cy="214" r="15" fill="#0d0a12" stroke="#6d7890" stroke-width="2"/>
  <path d="M248 228 L152 394" fill="none" stroke="#0d0a12" stroke-width="6" stroke-linecap="round"/>

  <!-- Forgings: the branching story-tree sprouting off the pen -->
  <g fill="none" stroke="#aeb9cf" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M301 214 C330 172 358 150 382 148"/>
    <path d="M301 214 C352 222 392 228 406 240"/>
    <path d="M301 214 C340 262 366 300 380 316"/>
  </g>
  <g fill="url(#ember)">
    <circle cx="384" cy="146" r="10"/>
    <circle cx="408" cy="238" r="11"/>
    <circle cx="382" cy="318" r="9"/>
  </g>
  <circle cx="301" cy="214" r="6.5" fill="#f0f3f8" stroke="#4a5466" stroke-width="1.5"/>

  <!-- The current story beat inked onto the pen -->
  <circle cx="232" cy="318" r="7" fill="url(#ember)"/>
  <circle cx="232" cy="318" r="11" fill="none" stroke="#ffa044" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- The spark at the writing tip, landing as a dotted path of new nodes -->
  <circle cx="150" cy="414" r="20" fill="url(#spark)"/>
  <circle cx="150" cy="414" r="7.5" fill="#fff6dd"/>
  <g fill="#ffcf7d">
    <circle cx="184" cy="430" r="3"/>
    <circle cx="150" cy="452" r="2.5"/>
    <circle cx="118" cy="432" r="2"/>
    <circle cx="206" cy="408" r="2"/>
  </g>
  <path d="M152 400 L132 420 L110 446" fill="none" stroke="#ffb066" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 16" stroke-opacity="0.8"/>
</svg>