spring:
  datasource:
    url: jdbc:h2:mem:coretest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VERSION,NAME;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

app:
  demo-user-id: 1

storyforge:
  analysis:
    enabled: true
  extraction:
    enabled: true

logging:
  level:
    root: warn
    org.springframework.test: warn