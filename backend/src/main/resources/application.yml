spring:
  application:
    name: story-core
  datasource:
    url: jdbc:h2:file:./data/storycore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VERSION,NAME;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  demo-user-id: 1

logging:
  level:
    org.springframework.jdbc.core: warn