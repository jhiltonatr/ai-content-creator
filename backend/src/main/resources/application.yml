spring:
  application:
    name: story-core
  datasource:
    url: jdbc:h2:file:./data/storycore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VERSION,NAME;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  demo-user-id: 1

storyforge:
  analysis:
    enabled: true  # AI analysis action switch; disabled by default
    base-url: http://localhost:8081
    model: mo-shakib/clearwriter
    timeout-ms: 180000
    max-paragraphs: 30
    max-paragraph-chars: 2000
  extraction:
    enabled: true  # AI extraction action switch; disabled by default

logging:
  level:
    org.springframework.jdbc.core: warn